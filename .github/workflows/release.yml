name: Release converters

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write
  packages: write

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: cargo fmt --check

      - name: Test
        run: cargo test

      - name: Bump version
        id: version
        run: |
          npm version ${{ inputs.bump }} --no-git-tag-version
          version="$(node -p "require('./package.json').version")"
          sed -i "s/^version = \".*\"/version = \"$version\"/" Cargo.toml
          node -e "
            const fs = require('fs');
            const pkg = require('./package.json');
            for (const dep of Object.keys(pkg.optionalDependencies || {})) {
              pkg.optionalDependencies[dep] = '$version';
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          cargo check
          echo "value=$version" >> $GITHUB_OUTPUT
          echo "tag=v$version" >> $GITHUB_OUTPUT

      - name: Commit & tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json Cargo.toml Cargo.lock bun.lock
          git commit -m "chore: release ${{ steps.version.outputs.tag }}"
          git tag -a ${{ steps.version.outputs.tag }} -m "${{ steps.version.outputs.tag }}"
          git push origin main --follow-tags

  build:
    needs: bump
    strategy:
      fail-fast: false
      matrix:
        include:
          # Tier 1 — native runners, no cross-toolchain risk. Broader Linux
          # arm64/musl and Windows arm64 coverage is a deliberately deferred
          # follow-up (needs zig/cross toolchains, unverifiable from a plain
          # dev machine) — see the napi.triples.additional list in
          # package.json for the currently-supported set.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx napi build --platform --release --target ${{ matrix.target }} --dts native-bindings.d.ts --js native-bindings.js
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: '*.node'

  publish:
    needs: [bump, build]
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.tag }}
      - name: Verify release secrets are configured
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::Missing repository secret: NPM_TOKEN (npmjs.org automation token — the @typeflowjs org doesn't exist yet, this workflow stays dormant until it does)"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Assemble per-platform packages
        run: bunx napi artifacts
      - name: Sync per-platform package versions
        run: bunx napi version
      - run: bun run build
      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in npm/*/; do
            (cd "$dir" && npm publish --access public)
          done
      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Create GitHub Release
        run: |
          gh release create ${{ needs.bump.outputs.tag }} \
            --title "${{ needs.bump.outputs.tag }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
